<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 675px;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  position: relative;
  background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 40%, #0d2137 100%);
}

/* Decorative circles */
.circle1 {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: rgba(30, 90, 180, 0.15);
  top: -100px;
  right: -50px;
}
.circle2 {
  position: absolute;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  background: rgba(30, 90, 180, 0.1);
  bottom: -80px;
  left: -40px;
}

.container {
  position: relative;
  z-index: 2;
  display: flex;
  height: 100%;
  padding: 40px 50px;
}

.left {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.right {
  width: 380px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding-left: 30px;
}

.badge {
  display: inline-block;
  background: linear-gradient(135deg, #ff6b35, #e84118);
  color: white;
  font-size: 16px;
  font-weight: 700;
  padding: 8px 24px;
  border-radius: 30px;
  letter-spacing: 2px;
  margin-bottom: 20px;
  text-transform: uppercase;
}

.title {
  font-size: 46px;
  font-weight: 900;
  color: #ffffff;
  line-height: 1.15;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.title span {
  color: #ffc107;
}

.subtitle {
  font-size: 22px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 30px;
  font-weight: 300;
}

.salary-box {
  background: linear-gradient(135deg, #ffc107, #f59e0b);
  display: inline-block;
  padding: 14px 32px;
  border-radius: 12px;
  margin-bottom: 28px;
  box-shadow: 0 8px 30px rgba(255,193,7,0.3);
}

.salary-label {
  font-size: 14px;
  color: rgba(0,0,0,0.6);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.salary {
  font-size: 36px;
  font-weight: 900;
  color: #0a1628;
  line-height: 1.2;
}

.salary small {
  font-size: 16px;
  font-weight: 600;
}

.info-row {
  display: flex;
  gap: 20px;
  margin-bottom: 25px;
}

.info-chip {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  padding: 10px 20px;
  border-radius: 10px;
  color: white;
  font-size: 15px;
  font-weight: 500;
  backdrop-filter: blur(10px);
}

.info-chip .num {
  color: #ffc107;
  font-weight: 800;
  font-size: 20px;
}

.contact {
  display: flex;
  gap: 16px;
  align-items: center;
}

.phone {
  font-size: 26px;
  font-weight: 800;
  color: #ffc107;
  letter-spacing: 1px;
}

.phone-icon {
  width: 44px;
  height: 44px;
  background: #ffc107;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

/* Right panel - elevator graphic */
.graphic-box {
  width: 320px;
  height: 420px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
}

.elevator-icon {
  font-size: 100px;
  margin-bottom: 15px;
}

.brand-name {
  font-size: 40px;
  font-weight: 900;
  color: white;
  letter-spacing: 4px;
  text-shadow: 0 2px 20px rgba(255,193,7,0.3);
}

.brand-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 6px;
  text-transform: uppercase;
  margin-top: 5px;
}

.highlight-line {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, #ffc107, #ff6b35, #ffc107);
}

/* Bottom bar */
.bottom-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.3);
  padding: 12px 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
  backdrop-filter: blur(10px);
}

.bottom-bar span {
  color: rgba(255,255,255,0.6);
  font-size: 14px;
}

.bottom-bar a {
  color: #ffc107;
  text-decoration: none;
  font-weight: 600;
}
</style>
</head>
<body>
  <div class="circle1"></div>
  <div class="circle2"></div>

  <div class="container">
    <div class="left">
      <div class="badge">🔥 TUYỂN DỤNG</div>
      <div class="title">KỸ THUẬT VIÊN<br><span>THANG MÁY</span></div>
      <div class="subtitle">Gia nhập đội ngũ FUJI TH — Phát triển sự nghiệp</div>

      <div class="salary-box">
        <div class="salary-label">Mức lương</div>
        <div class="salary">10 – 15 <small>triệu/tháng</small></div>
      </div>

      <div class="info-row">
        <div class="info-chip">📍 Hà Nội</div>
        <div class="info-chip">👥 Tuyển <span class="num">2</span> người</div>
        <div class="info-chip">⏰ Toàn thời gian</div>
      </div>

      <div class="contact">
        <div class="phone-icon">📞</div>
        <div class="phone">0989.397.282</div>
      </div>
    </div>

    <div class="right">
      <div class="graphic-box">
        <div class="elevator-icon">🏗️</div>
        <div class="brand-name">FUJI</div>
        <div style="font-size:32px;font-weight:900;color:#ffc107;letter-spacing:4px;">TH</div>
        <div class="brand-sub">THANG MÁY</div>
        <div class="highlight-line"></div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <span>📧 fujith557@gmail.com</span>
    <a href="#">🌐 thangmayfujith.com</a>
    <span>🏢 Số 10, ngõ 117, phố Mai Phúc, Phúc Lợi, Hà Nội</span>
  </div>
</body>
</html>
